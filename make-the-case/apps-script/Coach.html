<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make the Case · TOMBOJ</title>
<style>
:root{
  --tb-page:#0b0c0e;--tb-panel:#121418;--tb-sunken:#1b1e22;--tb-surface:#262a31;--tb-raised:#2d323a;
  --tb-border:#3d434b;--tb-divider:#383d45;--tb-panel-border:#22262b;--tb-dot:#1d2024;
  --tb-ink:#eceef0;--tb-soft:#b4b9c0;--tb-muted:#9ba1a9;
  --tb-ai:#bba5ee;--tb-human:#8db4f0;--tb-decision:#e5bf6e;--tb-motion:#6fd0e2;--tb-done:#7dcf9e;--tb-safety:#f09d92;
  --sans:Geist,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --shadow:inset 0 1px 0 rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.35);
  --shadow-card:inset 0 1px 0 rgba(255,255,255,.07),0 8px 20px rgba(0,0,0,.45);--glow-ai:0 0 22px rgba(187,165,238,.16);
}
@supports (color:oklch(0 0 0)){:root{
  --tb-ai:oklch(.78 .11 300);--tb-human:oklch(.78 .11 250);--tb-decision:oklch(.8 .11 80);
  --tb-motion:oklch(.82 .1 210);--tb-done:oklch(.78 .11 155);--tb-safety:oklch(.78 .11 25);--glow-ai:0 0 22px oklch(.78 .11 300 / .16);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--tb-page);color:var(--tb-ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--tb-human)}a:hover{color:var(--tb-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--tb-human);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}

.app{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100vh}
header.top{display:flex;align-items:center;gap:14px;padding:0 16px;height:54px;background:var(--tb-panel);border-bottom:1px solid var(--tb-panel-border);min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.wordmark{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.34em;color:var(--tb-ink)}
.series{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tb-muted)}
.focus{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--tb-divider)}
.focus .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:6px 12px;border-radius:8px;border:1px solid var(--tb-border);background:var(--tb-surface);color:var(--tb-ink);font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--tb-raised)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--tb-soft)}
.btn.ghost:hover:not(:disabled){background:var(--tb-surface);color:var(--tb-ink)}
.btn.primary{background:var(--tb-human);border-color:var(--tb-human);color:#0b0c0e;font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--tb-ink);border-color:var(--tb-ink)}
.btn.ai{background:var(--tb-ai);border-color:var(--tb-ai);color:#0b0c0e;font-weight:600}
.btn.ai:hover:not(:disabled){background:var(--tb-ink);border-color:var(--tb-ink)}
.btn.danger{border-color:color-mix(in srgb,var(--tb-safety) 60%,transparent);color:var(--tb-safety);background:transparent}
.btn.sm{min-height:28px;padding:3px 9px;font-size:12.5px}
.btn[aria-pressed="true"]{background:var(--tb-raised);border-color:var(--tb-soft)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;border:1px solid var(--tb-border);background:var(--tb-sunken);font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--tb-soft);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.c-ai{color:var(--tb-ai)}.c-human{color:var(--tb-human)}.c-decision{color:var(--tb-decision)}.c-motion{color:var(--tb-motion)}.c-done{color:var(--tb-done)}.c-safety{color:var(--tb-safety)}.c-muted{color:var(--tb-muted)}
.chip.c-ai,.chip.c-human,.chip.c-decision,.chip.c-motion,.chip.c-done,.chip.c-safety{border-color:color-mix(in srgb,currentColor 45%,transparent)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.demo-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;background:var(--tb-sunken);border-bottom:1px dashed #4a5058;font-size:13px;color:var(--tb-soft)}
.demo-banner b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--tb-ink)}

.main{display:grid;grid-template-columns:236px minmax(0,1fr) 356px;min-height:0;position:relative}
.main.no-panel{grid-template-columns:236px minmax(0,1fr)}
.main.no-panel .panel{display:none}

/* rail */
.rail{background:var(--tb-panel);border-right:1px solid var(--tb-panel-border);display:flex;flex-direction:column;min-height:0}
.rail-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 10px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tb-muted)}
.rail ul{list-style:none;margin:0;padding:0 8px 12px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.idea{width:100%;text-align:left;display:flex;flex-direction:column;gap:3px;padding:9px 10px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer}
.idea:hover:not(:disabled){background:var(--tb-sunken);border-color:var(--tb-panel-border)}
.idea[aria-current="true"]{background:var(--tb-surface);border-color:var(--tb-border);box-shadow:var(--shadow)}
.idea:disabled{cursor:not-allowed}
.idea .n{font-size:14px;font-weight:500;line-height:1.35;color:var(--tb-ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.idea .m{font-family:var(--mono);font-size:11px;color:var(--tb-muted);display:flex;gap:8px;flex-wrap:wrap}
.idea .m .f{color:var(--tb-human)}
.rail-foot{margin-top:auto;padding:10px 14px 14px;border-top:1px solid var(--tb-panel-border);font-size:12.5px;color:var(--tb-muted);line-height:1.45}

/* conversation */
.center{display:flex;flex-direction:column;min-height:0;background-color:var(--tb-page);background-image:radial-gradient(var(--tb-dot) 1px,transparent 1.2px);background-size:16px 16px}
#log{flex:1;overflow:auto;padding:24px 22px 18px;scroll-behavior:smooth}
.thread{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{border:1px solid var(--tb-border);border-radius:10px;background:var(--tb-surface);box-shadow:var(--shadow-card);overflow:hidden}
.band{display:flex;align-items:center;gap:8px;min-height:32px;padding:7px 14px;border-bottom:1px solid var(--tb-divider);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tb-muted)}
.band .k{font-weight:600}
.band .sp{flex:1}
.band time,.band .meta{letter-spacing:.02em;text-transform:none}
.body{padding:14px}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.62}
.msg.user{align-self:flex-end;max-width:88%;background:var(--tb-sunken);border-color:color-mix(in srgb,var(--tb-human) 40%,var(--tb-border))}
.msg.user .band .k{color:var(--tb-human)}
.msg.coach .band .k{color:var(--tb-ai)}
.msg.coach{max-width:100%}
.opener{border-color:var(--tb-divider)}
.opener .eb{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tb-muted);margin:2px 0 10px}
.opener h1{font-size:24px;line-height:1.22;margin:0 0 10px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.opener p{margin:0 0 14px;color:var(--tb-soft);font-size:15px}
.starters{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:13px;color:var(--tb-muted);text-align:center;padding:2px 8px}
.pending{border-color:color-mix(in srgb,var(--tb-motion) 55%,transparent)}
.pending .band .k{color:var(--tb-motion)}
.pending.uncertain,.pending.failed{border-color:color-mix(in srgb,var(--tb-decision) 55%,transparent)}
.pending.uncertain .band .k{color:var(--tb-decision)}
.pending.failed .band .k{color:var(--tb-safety)}
.pending .body p{margin:0 0 10px;color:var(--tb-soft);font-size:14px}
.pending .quote{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;padding:10px 12px;border-radius:8px;background:var(--tb-sunken);border:1px solid var(--tb-panel-border);margin-bottom:10px;max-height:160px;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* draft */
.draft{border-color:color-mix(in srgb,var(--tb-ai) 60%,transparent);box-shadow:var(--shadow-card),var(--glow-ai)}
.draft .band{background:color-mix(in srgb,var(--tb-ai) 9%,transparent);border-bottom-color:color-mix(in srgb,var(--tb-ai) 30%,transparent)}
.draft .band .k{color:var(--tb-ai)}
.draft .reason{margin:0 0 12px;font-size:14.5px;color:var(--tb-soft);white-space:pre-wrap}
.change{border-top:1px solid var(--tb-divider);padding:10px 0}
.change:first-of-type{border-top:0}
.change .f{font-weight:600;font-size:14px;margin-bottom:6px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.pair>div{padding:8px 10px;border-radius:8px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.pair .now{background:var(--tb-sunken);border:1px solid var(--tb-panel-border);color:var(--tb-soft)}
.pair .new{background:color-mix(in srgb,var(--tb-ai) 8%,var(--tb-sunken));border:1px solid color-mix(in srgb,var(--tb-ai) 35%,transparent)}
.pair .lbl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tb-muted);margin-bottom:3px}
.pair .new .lbl{color:var(--tb-ai)}
.empty{color:var(--tb-muted)}
.fine{font-size:12.5px;color:var(--tb-muted);line-height:1.5;margin:10px 0 0}

/* composer */
.composer{border-top:1px solid var(--tb-panel-border);background:var(--tb-panel);padding:10px 18px 12px}
.composer-in{max-width:680px;margin:0 auto}
.notice{display:flex;gap:10px;align-items:flex-start;padding:8px 10px 8px 12px;margin-bottom:8px;border-radius:8px;border:1px solid var(--tb-border);background:var(--tb-sunken);font-size:13.5px;line-height:1.45}
.notice .chip{flex:none;margin-top:1px}
.notice .tx{flex:1;color:var(--tb-ink)}
.box{border:1px solid var(--tb-border);border-radius:10px;background:var(--tb-sunken);box-shadow:var(--shadow)}
.box:focus-within{border-color:var(--tb-human)}
#msg{display:block;width:100%;min-height:62px;max-height:200px;resize:none;border:0;background:transparent;padding:11px 13px 6px;font-size:15.5px;line-height:1.55;outline:none}
#msg::placeholder{color:#868c95}
#msg[readonly]{color:var(--tb-soft)}
.box-foot{display:flex;align-items:center;gap:6px;padding:4px 6px 6px 8px;flex-wrap:wrap}
.quick{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.count{font-family:var(--mono);font-size:11px;color:var(--tb-muted);padding:0 6px}
.count.over{color:var(--tb-safety)}
.disclose{display:flex;gap:6px 12px;flex-wrap:wrap;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--tb-muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--tb-soft);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:12px}
.linkbtn:hover{color:var(--tb-ink)}

/* panel */
.panel{background:var(--tb-panel);border-left:1px solid var(--tb-panel-border);display:flex;flex-direction:column;min-height:0}
.panel-head{padding:12px 14px 0}
.panel-head .row{justify-content:space-between}
.spine{display:flex;align-items:center;margin:12px 0 2px}
.spine .st{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tb-muted);flex:none}
.spine .st i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--tb-border);background:var(--tb-sunken);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;color:var(--tb-muted)}
.spine .st.past i{border-color:var(--tb-soft);color:var(--tb-soft)}
.spine .st.on{color:var(--tb-ink)}.spine .st.on i{border-color:var(--tb-ink);color:var(--tb-ink);background:var(--tb-surface)}
.spine .ln{flex:1;height:1.5px;background:var(--tb-border);margin:0 8px;min-width:10px}
.tabs{display:flex;gap:2px;padding:10px 10px 0;border-bottom:1px solid var(--tb-divider)}
.tab{padding:7px 10px 8px;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13.5px;color:var(--tb-muted);cursor:pointer;font-weight:500}
.tab[aria-selected="true"]{color:var(--tb-ink);border-bottom-color:var(--tb-ink)}
.tab:hover{color:var(--tb-ink)}
.panel-body{flex:1;min-height:0;overflow:auto;padding:12px 12px 20px;background-image:radial-gradient(var(--tb-dot) 1px,transparent 1.2px);background-size:16px 16px;display:flex;flex-direction:column;gap:10px}
.panel-body>.card{flex:0 0 auto}
.panel-head,.tabs{flex-shrink:0}
.edit-actions{position:sticky;top:0;z-index:2;background:var(--tb-surface);padding:10px 0;border-bottom:1px solid var(--tb-divider)}
.composer-label{display:block;font-size:12px;color:var(--tb-soft);margin:0 0 5px}
.resume{border-color:var(--tb-human)}
.resume p{margin:0 0 10px}
.suggestion-actions{margin-top:10px}
.inline-review{margin-top:10px}
.inline-review textarea{min-height:100px}
.send-review{flex:1;min-height:0;overflow:auto;padding:18px}
.send-review .card{max-width:720px;margin:0 auto}
.send-review pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.sec{background:var(--tb-surface)}
.sec .body{padding:8px 12px 12px;display:flex;flex-direction:column;gap:10px}
.fld .fl{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--tb-muted);margin-bottom:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fld .fv{font-size:14px;line-height:1.5;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.fld .fv.empty{color:#7d838c;font-size:13px}
.decision{border-color:color-mix(in srgb,var(--tb-decision) 55%,transparent)}
.dia{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--tb-decision);display:inline-block;flex:none;margin:0 2px}
.band .no{color:#7d838c;font-weight:400}
.decision .band .k{color:var(--tb-decision)}
.decision .big{font-size:15px;font-weight:600;margin-bottom:6px}
.decision ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--tb-soft);display:flex;flex-direction:column;gap:3px}
.forecast .band .k{color:var(--tb-soft)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:13.5px}
.kv .v{font-family:var(--mono);font-size:13px;text-align:right}
.kv .v.na{color:var(--tb-muted);font-family:var(--sans);font-size:12.5px}
.kv .v.neg{color:var(--tb-decision)}
.pitch{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--tb-soft);margin:0}
.panel-empty{padding:18px 6px;color:var(--tb-muted);font-size:14px}

/* forms */
.form{display:flex;flex-direction:column;gap:12px}
.form label,.lab{display:block;font-size:13px;color:var(--tb-soft);margin-bottom:4px;font-weight:500}
.hint{font-size:12px;color:var(--tb-muted);margin-top:3px;line-height:1.4}
.inp{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--tb-border);background:var(--tb-page);font-size:14px;line-height:1.45}
.inp:focus{border-color:var(--tb-human)}
textarea.inp{resize:vertical;min-height:64px}
select.inp{appearance:auto}
.err{color:var(--tb-safety);font-size:13px}
.fs{border:1px solid var(--tb-divider);border-radius:10px;padding:6px 12px 10px;margin:0}
.fs legend{padding:0 4px;margin-left:-4px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;padding:6px 0;border-top:1px solid var(--tb-panel-border)}
.opt:first-of-type{border-top:0}
.opt input[type=radio]{margin:4px 0 0;accent-color:var(--tb-human);width:16px;height:16px}
.opt>label{margin:0;font-weight:400;color:var(--tb-ink);font-size:14px}
.opt>.inp{grid-column:2}
.opt .code{display:block;font-family:var(--mono);font-size:11.5px;color:var(--tb-muted)}
details.adv summary{cursor:pointer;font-size:13px;color:var(--tb-soft)}
details.adv[open] summary{margin-bottom:8px}

/* dialog */
dialog{border:1px solid var(--tb-border);border-radius:14px;background:var(--tb-panel);color:var(--tb-ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(5,6,7,.72)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 42px)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--tb-divider)}
.dlg-h h2{margin:0;font-size:18px;font-weight:600;flex:1}
.dlg-b{padding:16px 18px;overflow:auto;font-size:14.5px;line-height:1.55}
.dlg-b p{margin:0 0 10px}
.dlg-b ul{margin:0 0 10px;padding-left:20px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--tb-divider)}

/* loading */
.loading{display:flex;align-items:center;gap:10px;color:var(--tb-soft);font-size:14px;padding:30px 0;justify-content:center}

.only-narrow{display:none}
@media (max-width:1000px){
  .main,.main.no-panel{grid-template-columns:236px minmax(0,1fr)}
  .panel{position:absolute;top:0;right:0;bottom:0;width:min(380px,92vw);z-index:5;box-shadow:-12px 0 40px rgba(0,0,0,.5)}
  .series{display:none}
}
@media (max-width:760px){
  .main,.main.no-panel{grid-template-columns:minmax(0,1fr)}
  .rail{position:absolute;top:0;left:0;bottom:0;width:min(290px,86vw);z-index:6;box-shadow:12px 0 40px rgba(0,0,0,.5);display:none}
  .rail.open{display:flex}
  .only-narrow{display:inline-flex}
  .hide-narrow{display:none}
  #log{padding:16px 12px}
  .composer{padding:8px 10px 10px}
  .pair{grid-template-columns:minmax(0,1fr)}
  header.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 8px;padding:8px 10px;height:auto;min-height:54px}
  #railBtn{grid-column:1;grid-row:1}
  .brand{grid-column:2;grid-row:1}
  .tools{display:contents}
  #moreBtn{grid-column:3;grid-row:1}
  #panelBtn{grid-column:3;grid-row:2}
  #saveChip{grid-column:1/-1;grid-row:3;min-width:0;overflow:hidden}
  .focus{grid-column:1/3;grid-row:2;padding-left:0;border-left:0;min-width:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="btn ghost sm only-narrow" id="railBtn" aria-controls="rail" aria-expanded="false">Ideas</button>
    <div class="brand"><span class="wordmark" aria-label="Tomboj">TOMBOJ</span><span class="series">Automation Thursday · Make the Case</span></div>
    <div class="focus" id="focus"></div>
    <div class="tools">
      <span id="saveChip" role="status"></span>
      <button class="btn ghost sm hide-narrow" id="ctxBtn">Context</button>
      <button class="btn ghost sm hide-narrow" id="setBtn">Settings</button>
      <button class="btn ghost sm hide-narrow" id="expBtn">Export</button>
      <button class="btn ghost sm only-narrow" id="moreBtn">More</button>
      <button class="btn sm" id="panelBtn" aria-controls="panel" aria-pressed="true">Case</button>
    </div>
  </header>
  <div id="demoBanner" hidden></div>
  <div class="main" id="main">
    <nav class="rail" id="rail" aria-label="Your ideas"></nav>
    <section class="center" aria-label="Conversation">

/* ---------- helpers ---------- */

/* ---------- state ---------- */

  panel:window.innerWidth>1000,tab:'case',edit:null,draftEdit:null,replyDrafts:{},save:{kind:'busy',text:'Opening…'},setAside:{},scrollNext:true,railOpen:false};

function prov(id){var l=S.ws&&S.ws.settings&&Array.isArray(S.ws.settings.providers)?S.ws.settings.providers:[];for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null}

function isIdea(i){return i&&typeof i.id==='string'&&typeof i.title==='string'&&Number.isInteger(i.revision)&&i.fields&&i.metrics&&Array.isArray(i.messages)}

/* ---------- gateway ---------- */
function call(action,payload){
  payload=payload||{};
  return new Promise(function(resolve,reject){
    function fail(kind,msg){var e=new Error(msg);e.kind=kind;reject(e)}
    function handle(r){
      if(!r||typeof r!=='object'||typeof r.ok!=='boolean')return fail('malformed','The workspace sent back something this screen could not read. Nothing new is shown as saved.');
      if(r.ok)resolve(r.data);else fail('server',String(r.error||'The request could not be completed.'));
    }
    if(!LIVE){Demo.api({action:action,payload:payload}).then(handle);return}
    google.script.run.withSuccessHandler(handle)
      .withFailureHandler(function(){fail('transport','Google could not complete the request. Reopen the workspace before retrying.')})
      .api({action:action,payload:payload});
  });
}
function classify(msg){
  if(/changed in another window|no longer current|no longer in the workspace/i.test(msg))return 'stale';
  if(/daily request limit|rate or quota/i.test(msg))return 'limit';
  if(/API key in settings|API key for the selected provider|Choose an AI provider/i.test(msg))return 'nokey';
  if(/has no saved reply/i.test(msg))return 'interrupted';
  if(/Set up \/ check workspace|Run setup again|different headers|Missing workspace tab/i.test(msg))return 'setup';
  return 'error';
}
function setBusy(on,label){S.busy=on;S.busyLabel=label||'';if(on)S.save={kind:'busy',text:label||'Working…'};renderChrome()}
function markSaved(text){S.save=LIVE?{kind:'saved',text:(text||'Saved to your Sheet')+' · '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}:{kind:'demo',text:'Demo only · not saved'};}
function setNotice(kind,text,action){S.notice={kind:kind,text:text,action:action||null};renderNotice()}

function boot(){

  call('bootstrap').then(function(d){
    if(!isWorkspace(d))throw Object.assign(new Error('The workspace data was incomplete. Nothing has been changed.'),{kind:'malformed'});
    S.ws=d;S.save=LIVE?{kind:'saved',text:'Loaded from your Sheet'}:{kind:'demo',text:'Demo only · not saved'};S.scrollNext=true;
  }).catch(function(e){S.bootError=e.message;S.save={kind:'error',text:'Not loaded'}})
  .then(function(){setBusy(false);if(S.ws&&!S.bootError)S.save=S.save.kind==='busy'?{kind:'saved',text:'Loaded'}:S.save;renderAll()});
}

function reloadAfterStale(msg){
  setNotice('stale',msg+' The latest saved version has been reopened. Anything you had typed is still here — review the case before saving again.');
  return call('bootstrap').then(function(d){if(isWorkspace(d)){S.ws=d;S.save={kind:'saved',text:'Reloaded latest version'}}})
    .catch(function(e){S.save={kind:'error',text:'Reload failed'};setNotice('error','The case could not be reopened: '+e.message)})
    .then(renderAll);
}

function mutate(action,payload,okText){
  if(S.busy)return Promise.resolve(false);
  setBusy(true,'Saving…');
  return call(action,payload).then(function(d){
    if(!isWorkspace(d))throw Object.assign(new Error('The save response was incomplete. Reopen the workspace to confirm what was saved.'),{kind:'malformed'});
    S.ws=d;markSaved(okText);announce(LIVE?(okText||'Saved to your Sheet'):'Changed in the demo only');return true;
  }).catch(function(e){return handleErr(e).then(function(){return false})})
  .then(function(ok){setBusy(false);renderAll();return ok});
}
function handleErr(e){
  var kind=e.kind==='server'?classify(e.message):e.kind;

  if(kind==='stale')return reloadAfterStale(e.message);
  if(kind==='transport'||kind==='malformed')setNotice('error',e.message+' Reopen the workspace to see what was recorded.',{label:'Reopen workspace',fn:boot});
  else if(kind==='setup')setNotice('error',e.message);
  else setNotice('error',e.message);
  return Promise.resolve();
}

/* ---------- chat ---------- */
function send(fromRetry){

  if(hasUnsavedEdits()){setNotice('info','Save or cancel your edits before sending the next message.');return}

  var cfg=S.ws.settings;
  if(LIVE&&!cfg.provider){openSettings('Choose the AI service you have an API key for. Your message is kept in the box.');return}
  if(LIVE&&!cfg.hasKey){openSettings('Add your '+provLabel(cfg.provider)+' API key before sending. Your message is kept in the box.');return}
  if(LIVE&&S.disclosedFor!==cfg.provider){openDisclosure(true);return}
  var u=S.ws.usage,limit=S.ws.settings.maxCallsPerDay;
  if(fromRetry&&S.pending&&S.pending.state==='uncertain'&&LIVE&&(S.pending.provider!==cfg.provider||S.pending.model!==cfg.model)){
    setNotice('error','Return to the original provider and model before retrying this unconfirmed request. A different service must be a new, intentional attempt.');return}
  if(LIVE&&!fromRetry&&u&&Number.isInteger(u.calls)&&u.calls>=limit){setNotice('limit','You have used today\'s '+limit+' requests. The limit resets at midnight UTC. Your message is kept here; you can raise the limit in Settings.',{label:'Settings',fn:function(){openSettings()}});return}
  S.notice=null;renderNotice();
  var p0=Promise.resolve(S.ws.selectedId);
  if(!S.ws.selectedId){
    setBusy(true,'Creating a working idea…');
    p0=call('createIdea',{title:'Explore my work',problem:''}).then(function(d){
      if(!isWorkspace(d)||!d.selectedId)throw Object.assign(new Error('The new idea could not be confirmed. Reopen the workspace.'),{kind:'malformed'});
      S.ws=d;markSaved('Working idea created');renderAll();return d.selectedId;
    });
  }
  p0.then(function(ideaId){
    var reuse=S.pending&&S.pending.state==='uncertain'&&S.pending.message===text&&S.pending.ideaId===ideaId;
    S.pending={ideaId:ideaId,message:text,requestId:reuse?S.pending.requestId:newId(),provider:cfg.provider,model:cfg.model,state:'sending',retry:!!reuse};
    S.scrollNext=true;setBusy(true,LIVE?'Waiting for the coach…':'Preparing scripted reply…');renderAll();

      S.pending=null;markSaved('Reply saved to your Sheet');S.scrollNext=true;
      announce(LIVE?'The coach replied.'+(d.draft?' It suggested changes for you to review.':''):'Scripted demo reply shown.');
    }).catch(function(e){
      var kind=e.kind==='server'?classify(e.message):e.kind;
      if(kind==='transport'||kind==='malformed'){S.pending.state='uncertain';S.pending.error=e.message;S.save={kind:'error',text:'Reply not confirmed'}}
      else{
        S.pending.state='failed';S.pending.error=e.message;S.pending.kind=kind;S.save={kind:'error',text:'No reply saved'};
        if(kind==='stale'){S.pending=null;return reloadAfterStale(e.message)}
        if(kind==='nokey'){S.pending=null;openSettings(e.message)}
        if(kind==='limit'){S.pending=null;setNotice('limit',e.message+' Your message is kept here.')}
      }
    });
  }).catch(function(e){return handleErr(e)}).then(function(){setBusy(false);renderAll()});
}

    db.appendChild(h('b',null,'DEMONSTRATION'));
    db.appendChild(h('span',null,'Fictional Northstar data. No AI is called, replies are scripted, and nothing is saved to Google Sheets. Changes vanish when you close this window.'))}
}
function updateCount(){var n=$('msg').value.length,c=$('count');c.textContent=n>3000?n.toLocaleString()+' / 4,000':'';c.classList.toggle('over',n>4000)}

    h('button',{class:'btn sm',onClick:openNewIdea,disabled:S.busy||!S.ws},'New idea')));

  }else{
    var ul=h('ul',{role:'list'});

      var sel=i.id===S.ws.selectedId;
      ul.appendChild(h('li',null,h('button',{class:'idea','aria-current':sel?'true':'false',disabled:S.busy&&!sel,onClick:function(){selectIdea(i.id)}},
        h('span',{class:'n'},i.title),

    });
    r.appendChild(ul);
  }

function selectIdea(id){
  S.railOpen=false;

  S.replyDrafts[S.ws.selectedId||'new']=$('msg').value;
  $('msg').value=S.replyDrafts[id]||'';autosize();

function renderLog(){
  var log=$('log');clear(log);var t=h('div',{class:'thread'});log.appendChild(t);
  if(S.bootError){
    t.appendChild(h('div',{class:'card',style:'border-color:color-mix(in srgb,var(--tb-safety) 50%,transparent)'},
      h('div',{class:'band'},h('span',{class:'k c-safety'},'Could not open the workspace')),
      h('div',{class:'body'},h('p',{style:'margin:0 0 12px'},S.bootError),
        h('p',{class:'fine',style:'margin:0 0 12px'},'If this is a new Sheet, close this window and choose Make the Case → Set up / check workspace, then open the coach again.'),
        h('button',{class:'btn',onClick:boot},'Try again'))));
    return;
  }
  if(!S.ws){t.appendChild(h('div',{class:'loading'},chip('Opening your workspace','motion',true,true)));return}

  if(!i||!i.messages.length)t.appendChild(opener(i));

    if(i.messageCount>i.messages.length)t.appendChild(h('p',{class:'note'},'Showing the latest '+i.messages.length+' of '+i.messageCount+' messages. Earlier ones are kept in the History tab of your Sheet.'));

function opener(i){
  var starters=[['I don\'t have an idea yet','I don\'t have a specific idea yet. Here\'s what my work involves: '],
    ['I have several ideas','I have a few ideas and I\'m not sure which is worth pursuing: '],
    ['Something I proposed stalled','I suggested an improvement before and it stalled. Here\'s what happened: ']];
  return h('div',{class:'card opener'},
    h('div',{class:'band'},h('span',{class:'k',style:'color:var(--tb-ink)'},'Make the Case'),h('span',{class:'sp'}),h('span',{class:'meta'},'Automation Thursday')),
    h('div',{class:'body'},
      h('div',{class:'eb'},i?'Focus · '+i.title:'Start here · no idea needed yet'),
      h('h1',null,'Tell me about your work and something you\'d like to improve.'),
      h('p',null,'Start rough. A few sentences about what you do and what gets in the way is plenty — you don\'t need a finished idea or any business-case vocabulary. We\'ll work out the problem, the people involved, the evidence and the right next request together.'),
      h('div',{class:'starters'},starters.map(function(s){return h('button',{class:'btn sm',onClick:function(){fill(s[1])}},s[0])}),
        h('button',{class:'btn ghost sm',onClick:openExample},'See a fictional example'))));
}

  var user=m.role==='user';

    h('div',{class:'band'},h('span',{class:'k'},user?'You':(LIVE?'Coach · AI reply':'Coach · scripted demo reply')),h('span',{class:'sp'}),h('time',{datetime:m.at},fmtTime(m.at))),
