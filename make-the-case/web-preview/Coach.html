<body>
<div class="app">
  <header class="top">
    <div class="wordmark">TOMBOJ<span class="product">AUTOMATION THURSDAY</span></div>
    <div class="title" id="ideaTitle">Make the Case</div>
    <div class="top-actions"><button class="btn primary" id="topNewIdea">＋ New idea</button><button class="btn quiet" id="ideasButton">Ideas</button><button class="btn" id="caseButton">My case</button></div>
  </header>
  <nav class="progress" aria-label="Move through your idea"><div class="stages" id="stages"></div><div class="progress-right"><span class="saved" id="saveStatus">Preview ready</span><button class="text-link" id="jumpButton">Jump to topic</button></div></nav>
  <div class="preview-note"><strong>DESIGN PREVIEW</strong> · Fictional example · Scripted coach, no AI calls · Changes stay in this browser tab</div>
  <main class="workspace">
    <div class="scroll" id="scroll"><div class="conversation-layout" id="conversationLayout"><div class="flow" id="flow"></div><aside class="case-progress" id="caseProgress" aria-label="Your case progress" hidden></aside></div></div>
    <form class="composer" id="composer">
      <div class="composer-inner">
        <div class="input-shell">
          <label class="input-label" for="reply" id="replyLabel">Your reply</label>
          <textarea id="reply" rows="1" maxlength="4000" placeholder="Tell me in your own words…"></textarea>
          <div class="input-bottom"><div class="input-help"><button type="button" id="helpButton">Help me frame it</button><button type="button" id="skipButton">Skip for now</button></div><button class="btn primary" id="sendButton" type="submit">Send <span class="send-icon" aria-hidden="true">↑</span></button></div>
        </div>
        <div class="composer-foot"><span id="composerHint">Enter to send · Shift+Enter for a new line</span><span>Automation Thursday</span></div>
      </div>
    </form>
  </main>
</div>
<div id="announcement" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
<div id="toast" class="notice" role="status" hidden></div>
<script>
(()=>{
'use strict';
const KEY='tomboj-dialogue-design-preview-1';
const topics=[
 {id:'problem',stage:0,name:'The opportunity',question:'What is getting in the way of doing your work well?',intro:'Start with something you experience. You do not need a solution yet.',starter:'Something that gets in the way is ',example:'I spend too much time gathering information for customer updates, and commitments still get missed.'},
 {id:'currentWork',stage:0,name:'The work today',question:'Walk me through one example. How does this work get done today?',intro:'The everyday details help us understand where a change could help.',starter:'Today, I ',example:'I gather CRM notes and project updates, draft the message, then ask an account lead to check and send it.'},
 {id:'outcome',stage:0,name:'The outcome',question:'What would improving this help your customers, team, or company achieve?',intro:'Let’s connect the idea to a result that matters.',starter:'The outcome I want is ',example:'More reliable, on-time customer updates with fewer missed commitments. Freed time would go toward following up on customer issues.'},
 {id:'proposedWork',stage:1,name:'What could change',question:'What would you like AI to help with—and what should a person still do?',intro:'Keep the first version small. You can propose a change without being the person who builds it.',starter:'AI could help with ',example:'An approved tool could draft from permitted notes. A coordinator would check every fact, and the account lead would approve and send.'},
 {id:'businessOwner',stage:1,name:'People and ownership',question:'Who would be affected, and who should help you explore this?',intro:'Think about the people doing the work, reviewing it, receiving it, and deciding whether to proceed.',starter:'The people involved would be ',example:'Coordinators and account leads would use it; customers receive the updates. The account services lead could own the outcome, with IT and Legal advising. Their involvement is not confirmed.'},
 {id:'baselineSource',stage:1,name:'Evidence and effort',question:'How could you check the time, effort, and quality before claiming a benefit?',intro:'Your starting estimate is 12 updates each week at 25 minutes each. That is an estimate, not a measured result. Include checking, corrections, and ongoing support.',starter:'To check the baseline and compare the change, I would ',example:'Time ten updates before and after, including drafting and checking. Log corrections and missed commitments, and record tool, setup, and ongoing support costs. No savings are proven yet.'},
 {id:'testPlan',stage:1,name:'A small investigation',question:'What is the smallest useful way to find out whether this idea works?',intro:'An investigation can be the next request. You do not have to commit to a rollout.',starter:'A small investigation could be ',example:'Compare ten drafts using fictional information against the current approach. Ask a reviewer to score accuracy and record preparation and checking time.'},
 {id:'guardrails',stage:1,name:'Boundaries and quality',question:'What needs to be approved or protected, and what would make you stop?',intro:'Include tool and data permissions, Legal or security review, quality checks, and who handles exceptions. The tool cannot grant permission.',starter:'Before a live trial, we would need ',example:'IT, security, and Legal to review the tool and data. A person checks all facts before sending. Stop if unsupported claims appear or review takes away the expected benefit. No live trial is approved.'},
 {id:'request',stage:2,name:'The next request',question:'What specific decision or support do you want someone to give you?',intro:'Ask for the next sensible step: time to investigate, access to evidence, a reviewer, or a bounded trial after approval.',starter:'I am asking for ',example:'Two hours with an account lead and Operations to measure the current workflow and assess approved tooling, before requesting any live trial.'},
 {id:'contribution',stage:2,name:'Your contribution',question:'How would you describe the part you have contributed so far?',intro:'Your work can include identifying the opportunity, sharing domain knowledge, collecting evidence, or coordinating people. Record what happened; do not claim future results.',starter:'My contribution so far is ',example:'I identified the recurring problem, documented the workflow, proposed a measurement plan, and brought together the questions needed for a decision. This has not been implemented.'}
